<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DubMetric — Hero + Upload</title>
<meta name="description" content="Premium synchronization QC for dubbed audio. Compare a reference master with a dubbed version before delivery.">
<style>
  :root {
    --bg: #08090b;
    --bg-soft: #0d0f12;
    --panel-solid: #121418;
    --panel-raised: #171a1f;
    --line: rgba(255,255,255,.09);
    --line-strong: rgba(255,255,255,.16);
    --ink: #f4f1ea;
    --muted: #98999d;
    --muted-strong: #bebfc2;
    --champagne: #d8bd89;
    --champagne-soft: rgba(216,189,137,.12);
    --cold-blue: #8fa9c0;
    --radius-sm: 12px;
    --radius: 20px;
    --radius-lg: 30px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(1200px 700px at 82% -14%, rgba(216,189,137,.055), transparent 62%),
      radial-gradient(1000px 720px at -8% 114%, rgba(143,169,192,.045), transparent 58%),
      var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .fold {
    min-height: 100svh;
    max-width: 1500px;
    margin-inline: auto;
    padding: clamp(22px, 3.2vw, 56px);
    display: grid;
    grid-template-columns: 1.04fr .96fr;
    gap: clamp(28px, 3.4vw, 64px);
    align-items: stretch;
  }
  .fold > section { animation: arrive .55s cubic-bezier(.22,.8,.2,1) both; }
  .fold > section:last-child { animation-delay: .08s; }
  @keyframes arrive { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .fold > section { animation: none; } }

  /* ------------------------------ HERO -------------------------------- */
  .hero-stage {
    position: relative;
    display: flex;
    border-radius: var(--radius-lg);
    border: 1px solid var(--line);
    background:
      radial-gradient(68% 52% at 66% 20%, rgba(216,189,137,.08), transparent 60%),
      radial-gradient(56% 50% at 16% 92%, rgba(143,169,192,.06), transparent 58%),
      linear-gradient(180deg, var(--bg-soft), #0a0c0f 78%, var(--panel-solid));
    box-shadow: inset 0 0 140px rgba(0,0,0,.5), 0 32px 90px rgba(0,0,0,.45);
    overflow: hidden;
  }
  .brandline {
    position:absolute; z-index:2; top:26px; left:30px;
    display:flex; align-items:center; gap:.65rem;
  }
  .brand-mark { display:flex; gap:5px; align-items:flex-end; height:21px; }
  .brand-mark i { display:block; width:5px; border-radius:3px; background:var(--ink); }
  .brand-mark i:nth-child(2){ height:100%; background:var(--champagne); }
  .brandline b { font-size:.95rem; font-weight:750; letter-spacing:.01em; }

  .bust-zone { margin:auto; position:relative; z-index:1; padding: clamp(28px,4vw,56px); }
  .bust-zone::before {
    content:""; position:absolute; inset:-8%;
    background: radial-gradient(46% 38% at 50% 34%, rgba(216,189,137,.10), transparent 70%);
    pointer-events:none;
  }
  .bust {
    position:relative; z-index:1;
    display:block;
    height: clamp(400px, 72vh, 740px);
    width:auto; max-width:100%;
    filter: drop-shadow(0 44px 70px rgba(0,0,0,.62))
            drop-shadow(0 10px 24px rgba(0,0,0,.5));
    -webkit-box-reflect: below 2px linear-gradient(transparent 78%, rgba(255,255,255,.09));
  }

  /* --------------------------- PRODUCT PANEL -------------------------- */
  .product-side { display:flex; }
  .upload-panel {
    margin:auto; width:100%; max-width:590px;
    background: rgba(18,20,24,.86);
    border: 1px solid rgba(255,255,255,.11);
    border-radius: 28px;
    box-shadow: 0 40px 110px rgba(0,0,0,.5), 0 2px 0 rgba(255,255,255,.03) inset;
    padding: clamp(30px, 3.4vw, 58px);
    backdrop-filter: blur(16px);
  }
  .eyebrow {
    display:inline-flex; align-items:center; gap:.6rem;
    color:var(--champagne); font-size:.67rem; font-weight:800;
    letter-spacing:.14em; text-transform:uppercase;
  }
  .eyebrow-dot { width:.42rem; height:.42rem; border-radius:50%; background:var(--champagne); }
  h1 {
    margin-top:1.15rem;
    font-size: clamp(2rem, 3vw, 2.95rem);
    line-height:1.05; font-weight:800; letter-spacing:-.02em;
  }
  h1 span { color:#85878b; }
  .lede { margin-top:1.05rem; color:var(--muted-strong); font-size:.94rem; line-height:1.68; max-width:33rem; }

  .drop-grid { display:grid; gap:.85rem; margin-top:1.9rem; }
  .drop-zone { position:relative; display:block; cursor:pointer; }
  .drop-zone input { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .dz-box {
    display:flex; align-items:center; justify-content:space-between; gap:1rem;
    border:1px dashed rgba(255,255,255,.17);
    border-radius:16px;
    background: rgba(255,255,255,.022);
    padding: 1.02rem 1.2rem;
    transition: border-color .18s ease, background .18s ease;
  }
  .drop-zone:hover .dz-box,
  .drop-zone:focus-within .dz-box { border-color: var(--champagne); background: var(--champagne-soft); }
  .dz-box:focus-within { outline:2px solid var(--champagne); outline-offset:2px; }
  .drop-zone.is-filled .dz-box { border-style:solid; border-color: rgba(255,255,255,.13); background: rgba(255,255,255,.04); }
  .dz-label { display:flex; flex-direction:column; gap:.3rem; }
  .dz-title { font-size:.8rem; font-weight:750; letter-spacing:.02em; }
  .dz-title em { font-style:normal; color:var(--champagne); font-size:.6rem; letter-spacing:.12em; text-transform:uppercase; margin-right:.55rem; }
  .dz-hint { color:#75777c; font-size:.73rem; }
  .dz-file { color:var(--muted-strong); font-size:.73rem; max-width:15rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:rtl; text-align:right; }
  .dz-icon { flex:0 0 auto; width:36px; height:36px; border-radius:50%;
    display:grid; place-items:center;
    background: rgba(255,255,255,.04); border:1px solid var(--line); color:var(--muted-strong);
    transition: color .18s ease, border-color .18s ease; }
  .drop-zone.is-filled .dz-icon { color:var(--champagne); border-color: rgba(216,189,137,.35); }

  .analyze-btn {
    margin-top:1.3rem; width:100%;
    display:inline-flex; align-items:center; justify-content:center;
    border:0; border-radius:999px; padding:1.05rem 1.6rem;
    background:var(--ink); color:#0c0d0f;
    font: inherit; font-weight:760; font-size:.97rem; letter-spacing:.005em; cursor:pointer;
    transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
  }
  .analyze-btn:hover:enabled { background:#fff; transform: translateY(-1px); box-shadow: 0 14px 34px rgba(0,0,0,.35); }
  .analyze-btn:focus-visible { outline:2px solid var(--champagne); outline-offset:3px; }
  .analyze-btn:disabled { opacity:.36; cursor:not-allowed; }

  .helper-row { margin-top:.95rem; }
  .helper { color:#75777c; font-size:.71rem; }
  .helper b { color:var(--champagne); font-weight:750; }
  .form-status { min-height:1.15rem; margin-top:.75rem; color:var(--champagne); font-size:.76rem; font-weight:650; }
  .form-status[data-error="true"] { color:var(--fail, #df7474); }

  /* ------------------------------ MOBILE ------------------------------ */
  @media (max-width: 56rem) {
    .fold { grid-template-columns: 1fr; align-items:start; }
    .hero-stage { order:-1; min-height: 52svh; }
    .bust { height: clamp(320px, 46svh, 480px); }
    .upload-panel { padding: 26px 22px; }
  }
</style>
</head>
<body>

<main class="fold">

  <!-- ============================ HERO VISUAL ============================ -->
  <section class="hero-stage" aria-label="DubMetric brand visual">
    <div class="brandline"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><b>DubMetric</b></div>
    <div class="bust-zone">
      <img class="bust"
           src="assets/mannequin_chrome_headphones.png"
           alt="Polished chrome mannequin wearing premium headphones"
           width="1122" height="1402">
    </div>
  </section>

  <!-- ========================== UPLOAD PANEL ============================= -->
  <section class="product-side">
    <form class="upload-panel" id="analyze-form" novalidate>
      <p class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span>Private beta · Dubbing sync QC</p>
      <h1>Catch dubbing sync errors <span>before delivery.</span></h1>
      <p class="lede">Compare a reference master with a dubbed version to detect global offset, progressive drift and local sync anomalies.</p>

      <div class="drop-grid">
        <label class="drop-zone" data-zone="reference">
          <input type="file" id="file-reference" accept=".wav,audio/wav,audio/x-wav">
          <span class="dz-box">
            <span class="dz-label">
              <span class="dz-title"><em>Input 1</em>Reference master</span>
              <span class="dz-hint">Original mix · WAV</span>
            </span>
            <span class="dz-file" data-file>Choose file</span>
            <span class="dz-icon" aria-hidden="true">↑</span>
          </span>
        </label>

        <label class="drop-zone" data-zone="dubbed">
          <input type="file" id="file-dubbed" accept=".wav,audio/wav,audio/x-wav">
          <span class="dz-box">
            <span class="dz-label">
              <span class="dz-title"><em>Input 2</em>Dubbed master</span>
              <span class="dz-hint">Dubbed mix · same rate</span>
            </span>
            <span class="dz-file" data-file>Choose file</span>
            <span class="dz-icon" aria-hidden="true">↑</span>
          </span>
        </label>
      </div>

      <button type="submit" class="analyze-btn" id="analyze-btn" disabled>Analyze synchronization</button>

      <p class="helper-row helper"><b>Beta</b> · PCM WAV · Up to 3 minutes per file</p>
      <p class="form-status" id="form-status" role="status"></p>
    </form>
  </section>

</main>

<script>
(function () {
  "use strict";
  var form = document.getElementById("analyze-form");
  var btn = document.getElementById("analyze-btn");
  var status = document.getElementById("form-status");
  var refInput = document.getElementById("file-reference");
  var dubInput = document.getElementById("file-dubbed");

  function refresh() {
    var ready = refInput.files.length > 0 && dubInput.files.length > 0;
    btn.disabled = !ready;
    [ [refInput, "[data-zone='reference']"],
      [dubInput, "[data-zone='dubbed']"] ].forEach(function (pair) {
      var zone = document.querySelector(pair[1]);
      zone.classList.toggle("is-filled", pair[0].files.length > 0);
      zone.querySelector("[data-file]").textContent =
        pair[0].files.length ? pair[0].files[0].name : "Choose file";
    });
  }

  refInput.addEventListener("change", refresh);
  dubInput.addEventListener("change", refresh);

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    if (btn.disabled) return;
    status.setAttribute("data-error", "true");
    status.textContent =
      "Concept preview only \u2013 run the local DubMetric beta app to analyze.";
  });
})();
</script>

</body>
</html>
